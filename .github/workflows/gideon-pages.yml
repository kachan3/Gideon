name: Gideon en GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main, master, gideon-pages]
    paths: ['GideonCompanion/**', '10_Reglas/**', '20_Contenido/**', '.github/workflows/gideon-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: GideonCompanion/pages
      - run: node --test GideonCompanion/pages/pages.test.mjs
      - run: node GideonCompanion/pages/build.mjs
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
        working-directory: GideonCompanion/pages
      - run: node GideonCompanion/pages/browser.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: GideonCompanion/pages/dist
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
