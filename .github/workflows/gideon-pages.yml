name: Gideon en GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main, master, gideon-pages]
    paths: ['GideonCompanion/**', '10_Reglas/**', '20_Contenido/**', '.github/workflows/gideon-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: GideonCompanion/pages
      - run: node --test GideonCompanion/pages/pages.test.mjs GideonCompanion/sql/core-sync.test.mjs GideonCompanion/sql/reference-format.test.mjs GideonCompanion/sql/player-copy.test.mjs GideonCompanion/sql/orders.test.mjs GideonCompanion/sql/paths.test.mjs GideonCompanion/sql/creation.test.mjs GideonCompanion/sql/trait-choices.test.mjs GideonCompanion/sql/class-guide.test.mjs GideonCompanion/sql/miracle-copy.test.mjs
      - run: node GideonCompanion/pages/build.mjs
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
        working-directory: GideonCompanion/pages
      - run: node GideonCompanion/pages/browser.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: GideonCompanion/pages/dist
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar los archivos publicados
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${SITE_URL}?release=${GITHUB_SHA}" -o /tmp/gideon-index.html && grep -q 'runtime/bootstrap.js' /tmp/gideon-index.html; then
              echo "La URL pública entrega el creador de personajes."
              exit 0
            fi
            echo "Esperando a que la URL pública entregue el creador (intento ${attempt})."
            head -c 500 /tmp/gideon-index.html || true
            sleep 10
          done
          exit 1
  verify-live:
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: GideonCompanion/pages
      - run: node GideonCompanion/pages/build.mjs
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
        working-directory: GideonCompanion/pages
      - name: Crear y recuperar una ficha en el sitio público
        run: node GideonCompanion/pages/browser.test.mjs
        env:
          GIDEON_PAGES_URL: https://kachan3.github.io/Gideon/?release=${{ github.sha }}
